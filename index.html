<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Register · College Attendance Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

<div class="mobile-topbar">
  <span class="brand-mark">Register</span>
  <button class="btn btn-sm" data-theme-toggle>●</button>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">Attendance</span>
      <span class="brand-sub">register</span>
    </div>
    <nav class="nav">
      <a href="index.html" data-nav="register">Daily Register</a>
      <a href="dashboard.html" data-nav="dashboard">Dashboard</a>
      <a href="subjects.html" data-nav="subjects">Subjects</a>
      <a href="routine.html" data-nav="routine">Routine</a>
      <a href="settings.html" data-nav="settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-toggle" data-theme-toggle>● Dark mode</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Daily Register</h1>
    </div>

    <div class="sheet">
      <div class="date-strip">
        <button class="btn btn-sm" id="prevDay" aria-label="Previous day">‹ Prev</button>
        <input type="date" id="dateInput">
        <button class="btn btn-sm" id="nextDay" aria-label="Next day">Next ›</button>
        <button class="btn btn-sm" id="todayBtn">Today</button>
        <span class="date-heading" id="dateHeading"></span>
      </div>
    </div>

    <div class="sheet sheet-ruled" id="classList">
      <!-- populated by register.js -->
    </div>

    <p class="muted" id="routineNote"></p>
  </main>
</div>

<div class="mobile-tabbar">
  <a href="index.html" data-nav="register">Register</a>
  <a href="dashboard.html" data-nav="dashboard">Dashboard</a>
  <a href="subjects.html" data-nav="subjects">Subjects</a>
  <a href="routine.html" data-nav="routine">Routine</a>
  <a href="settings.html" data-nav="settings">Settings</a>
</div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
